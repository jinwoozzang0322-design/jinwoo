<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>교통약자 이동지원 앱</title>
    <style>
        /* 웹 브라우저 전체 배경 */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #e9ecef;
            margin: 0;
            font-family: 'Malgun Gothic', sans-serif;
        }

        /* 📱 스마트폰 형태의 앱 화면 틀 */
        #app-container {
            width: 360px;
            height: 700px;
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            overflow: hidden;
            position: relative;
        }

        /* 모든 화면 기본 숨김 */
        .app-screen {
            display: none !important; 
            width: 100%;
            height: 100%;
            padding: 20px;
            box-sizing: border-box;
            flex-direction: column;
            overflow-y: auto;
            background-color: white;
        }

        /* 활성화된 화면만 보여줌 */
        .app-screen.active {
            display: flex !important; 
        }

        h2 { text-align: center; border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 20px; font-size: 18px;}
        
        .spacer { flex-grow: 1; }
        
        /* 버튼 디자인 */
        button {
            width: 100%;
            padding: 15px;
            margin-bottom: 10px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:active { opacity: 0.7; }
        
        /* 버튼 색상 */
        .btn-blue { background-color: #3b5bdb; color: white; }
        .btn-green { background-color: #2b8a3e; color: white; }
        .btn-dark { background-color: #343a40; color: white; }
        .btn-outline { background-color: white; color: #333; border: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center;}
        
        /* 지하철 호선 뱃지 */
        .badge { padding: 3px 8px; border-radius: 12px; font-size: 12px; color: white; font-weight: bold; margin-left: 5px; }
        .line-2 { background-color: #00A84D; } /* 2호선 초록색 */
        .line-5 { background-color: #996CAC; } /* 5호선 보라색 */

        /* 버스 리스트 디자인 */
        ul { list-style: none; padding: 0; margin: 0; }
        ul li { 
            padding: 15px 5px; 
            border-bottom: 1px solid #ddd; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
        }
        .bus-num { font-size: 20px; font-weight: bold; color: #3b5bdb; }
        .bus-num.jisun { color: #2b8a3e; } /* 지선버스 초록색 */
        .bus-type { font-size: 12px; color: #666; margin-left: 5px; }
        .bus-info { text-align: right; font-size: 14px; font-weight: bold;}
        .bus-info small { display: block; font-size: 11px; color: #888; font-weight: normal;}
    </style>
</head>
<body>

<div id="app-container">

    <div id="screen-home" class="app-screen active">
        <h1 style="text-align: center; margin-top: 50px;">환영합니다
